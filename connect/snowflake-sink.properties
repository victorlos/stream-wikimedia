# Snowflake sink: Kafka topics -> WIKIMEDIA.RAW tables, through Snowpipe Streaming.
# Connector v4 (high-performance architecture). No warehouse is used.
#
# Two settings are added when the container starts, so they never live in git:
#   snowflake.url.name     from connect/connect.env
#   snowflake.private.key  from secrets/kafka_connect_svc.p8
#
# Docs: https://docs.snowflake.com/en/connectors/kafkahp/setup-kafka

# Also the Kafka consumer group name (connect-WIKIMEDIA_SNOWFLAKE_SINK).
# Must be a valid unquoted Snowflake identifier.
name=WIKIMEDIA_SNOWFLAKE_SINK
connector.class=com.snowflake.kafka.connector.SnowflakeStreamingSinkConnector
tasks.max=1

topics=wikimedia-recentchange,wikimedia-clean
snowflake.topic2table.map=wikimedia-recentchange:RECENT_CHANGES,wikimedia-clean:CLEAN_CHANGES

# Created by Terraform (terraform/access.tf).
snowflake.database.name=WIKIMEDIA
snowflake.schema.name=RAW
snowflake.user.name=KAFKA_CONNECT_SVC
snowflake.role.name=WIKI_LOADER

# Messages are JSON without an embedded schema.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Land each message whole in a RECORD_CONTENT VARIANT column, with topic,
# partition, offset and timestamps in RECORD_METADATA. The raw layer never
# rejects a record because its shape changed. dbt does the typing.
snowflake.enable.schematization=false

# This is a new install, not a migration from connector v3.
snowflake.streaming.validate.compatibility.with.classic=false

# Stop on errors and log them, rather than silently skipping records.
errors.tolerance=none
errors.log.enable=true
