# Kafka Connect worker, standalone mode: one process, connector settings read
# from a file at startup. Sink connectors keep their position in a normal Kafka
# consumer group, so nothing important is stored locally.

bootstrap.servers=kafka:29092

# Default converters. The connector file repeats them for clarity.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Required by standalone mode. Only used by source connectors.
offset.storage.file.filename=/tmp/connect.offsets

# REST API at http://localhost:8083 (status, logs, restarts)
listeners=http://0.0.0.0:8083
