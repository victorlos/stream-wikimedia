# Local stack: one Kafka broker in KRaft mode (no ZooKeeper), one topic, a Kafka UI,
# and a Flink cluster.
#
#   docker compose up -d      start everything
#   docker compose down       stop, keep the data
#   docker compose down -v    stop and delete the data
name: docker-compose-kafka-flink

services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # One node acting as both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Two client listeners, because a client must be able to reach the address
      # the broker advertises:
      #   EXTERNAL -> localhost:9092  for programs on your machine (the producer)
      #   INTERNAL -> kafka:29092     for other containers (the UI, Kafka Connect later)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker settings: internal topics cannot have 3 replicas here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created on purpose (see init-topics), never by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Keep one day of events so the disk does not fill up.
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Runs once, creates the topic, exits.
  init-topics:
    image: apache/kafka:4.2.0
    container_name: init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic wikimedia-recentchange
        --partitions 3
        --replication-factor 1

  # Browse topics, messages and consumer groups at http://localhost:8080
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Flink cluster: the job manager coordinates, the task manager does the work.
  # Web UI at http://localhost:8081
  jobmanager:
    image: flink:2.2.1-scala_2.12-java17
    container_name: flink-jobmanager
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink/sql:/opt/flink/sql
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar

  taskmanager:
    image: flink:2.2.1-scala_2.12-java17
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      # A slot runs one parallel piece of a job. Four is plenty for this project.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar:/opt/flink/lib/flink-sql-connector-kafka-5.0.0-2.2.jar

  # Streams Wikimedia edits into Kafka.
  producer:
    image: python:3.12-slim
    container_name: wikimedia-producer
    depends_on:
      init-topics:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./producer:/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: sh -c "pip install --quiet -r requirements.txt && python connect-api.py"
    restart: unless-stopped


  # Runs once: downloads the Snowflake connector and the Bouncy Castle libraries
  # it needs into connect/plugins (ignored by git). Skips files already there.
  connect-plugins:
    image: curlimages/curl:8.15.0
    container_name: connect-plugins
    user: "0:0"
    volumes:
      - ./connect/plugins:/plugins
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        get() {
          if [ -s "/plugins/$$2" ]; then echo "present $$2"; return; fi
          curl -fsSL -o "/plugins/$$2.part" "$$1/$$2"
          mv "/plugins/$$2.part" "/plugins/$$2"
          echo "downloaded $$2"
        }
        M=https://repo1.maven.org/maven2
        get $$M/com/snowflake/snowflake-kafka-connector/4.2.3 snowflake-kafka-connector-4.2.3.jar
        get $$M/org/bouncycastle/bc-fips/2.1.0 bc-fips-2.1.0.jar
        get $$M/org/bouncycastle/bcpkix-fips/2.1.8 bcpkix-fips-2.1.8.jar

  # Kafka Connect: reads both topics and writes them to WIKIMEDIA.RAW in Snowflake.
  # Status at http://localhost:8083/connectors/WIKIMEDIA_SNOWFLAKE_SINK/status
  # 4.1.1 is the Kafka version Snowflake tests connector v4 against.
  kafka-connect:
    image: apache/kafka:4.1.1
    container_name: kafka-connect
    depends_on:
      init-topics:
        condition: service_completed_successfully
      connect-plugins:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    env_file:
      - ./connect/connect.env # SNOWFLAKE_URL
    environment:
      # Snowflake asks for the jars on the main classpath, not in plugin.path.
      CLASSPATH: /opt/connect-plugins/*
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
    volumes:
      - ./connect/plugins:/opt/connect-plugins:ro
      - ./connect/worker.properties:/etc/kafka-connect/worker.properties:ro
      - ./connect/snowflake-sink.properties:/etc/kafka-connect/snowflake-sink.properties:ro
      - ./secrets/kafka_connect_svc.p8:/secrets/kafka_connect_svc.p8:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Add the account URL and the private key (one line, no BEGIN/END lines)
        # to the connector settings, in a file that exists only in the container.
        cp /etc/kafka-connect/snowflake-sink.properties /tmp/snowflake-sink.properties
        echo "snowflake.url.name=$$SNOWFLAKE_URL" >> /tmp/snowflake-sink.properties
        echo "snowflake.private.key=$$(grep -v -- '-----' /secrets/kafka_connect_svc.p8 | tr -d '\n\r')" >> /tmp/snowflake-sink.properties
        exec /opt/kafka/bin/connect-standalone.sh \
          /etc/kafka-connect/worker.properties /tmp/snowflake-sink.properties
    restart: unless-stopped

volumes:
  kafka-data: